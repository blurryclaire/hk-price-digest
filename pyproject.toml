[project]
name = "hk-price-digest"
version = "0.1.0"
description = "Local HK supermarket price digests from CSV (Grok Bot tool) — no scrapers, sample in, markdown/JSON out."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "deedade" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hk-price-digest = "hk_price_digest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
